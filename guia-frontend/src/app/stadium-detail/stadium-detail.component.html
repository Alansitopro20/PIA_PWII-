<div class="stadium-detail-container" *ngIf="stadium">

  <!-- Imagen principal -->
  <div class="header-image">
    <img [src]="'http://localhost:8000/' + stadium.imagenPrincipal" />
  </div>

   <!-- Botón de favoritos -->
  <button 
    class="fav-btn"
    (click)="toggleFavorite()">

    <i 
      class="bi" 
      [ngClass]="isFavorite ? 'bi-heart-fill' : 'bi-heart'">
    </i>

    {{ isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos' }}
  </button>


  <!--Video-->
  <iframe 
    *ngIf="stadium?.video_url"
    [src]="stadium.video_url | safeUrl"
    frameborder="0"
    allowfullscreen>
  </iframe>

  <h1>{{ stadium.name }}</h1>
  <h3>{{ stadium.subtitulo }}</h3>

  <p class="description">{{ stadium.descripcion }}</p>

  <!-- Información principal -->
  <div class="info-box">
    <p><strong>Ciudad:</strong> {{ stadium.ciudad }}</p>
    <p><strong>Capacidad:</strong> {{ stadium.capacidad | number }}</p>
    <div class="average-rating">
  <strong>⭐ Calificación promedio:</strong> {{ averageRating }} / 5
</div>

  </div>

  <!-- Galería -->
  <div class="gallery" *ngIf="stadium.galeria?.length">
    <h3>Galería</h3>

    <div class="gallery-grid">
      <img 
        *ngFor="let img of stadium.galeria"
        [src]="'http://localhost:8000/' + img"
        class="gallery-item"
      />
    </div>
  </div>

  <!-- TOAST -->
  <div class="global-toast" *ngIf="toastMessage">
    {{ toastMessage }}
  </div>


<!-- RESEÑAS -->
  <div class="content">
    <!--<h1>{{  stadium.name  }}</h1>-->

    <app-review
      [itemId]="stadium.id"
      [itemType]="'stadium'"
      [parentReviews]="reviews"
      (refreshReviews)="onRefreshReviews()">
    </app-review>

  </div>


  
</div>
