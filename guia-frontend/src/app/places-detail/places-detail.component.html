<div class="place-detail-container" *ngIf="place">

  <!-- Imagen principal -->
  <div class="header-image">
    <img [src]="'http://localhost:8000/' + place.imagenPrincipal" />
  </div>

   <!-- Botón de favoritos -->
  <button 
    class="fav-btn"
    (click)="toggleFavorite()">

    <i 
      class="bi" 
      [ngClass]="isFavorite ? 'bi-heart-fill' : 'bi-heart'">
    </i>

    {{ isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos' }}
  </button>


  <!--Video-->
  <iframe 
    *ngIf="place?.video_url"
    [src]="place.video_url | safeUrl"
    frameborder="0"
    allowfullscreen>
  </iframe>

  <h1>{{ place.name }}</h1>
  <h3>{{ place.subtitulo }}</h3>


  <p class="ciudad">{{ place.ciudad }}</p>
  <p class="description">{{ place.descripcion }}</p>


  <div class="info-box">
    <p><strong>Categoría:</strong> {{ place.categoria }}</p>
    <p><strong>Calificación:</strong> ⭐ {{ place.calificacion }}</p>
  </div>

  <!-- Galería -->
  <div class="gallery" *ngIf="place.galeria?.length">
    <h3>Galería</h3>

    <div class="gallery-grid">
      <img 
        *ngFor="let img of place.galeria"
        [src]="'http://localhost:8000/' + img"
        class="gallery-item"
      />
    </div>
  </div>

    <!-- TOAST -->
  <div class="global-toast" *ngIf="toastMessage">
    {{ toastMessage }}
  </div>


  <!-- RESEÑAS -->
    <div class="content">
      <!--<h1>{{  stadium.name  }}</h1>-->

      <app-review
        [itemId]="place.id"
        [itemType]="'place'"
        [parentReviews]="reviews"
        (refreshReviews)="onRefreshReviews()">
      </app-review>

  </div>

</div>
