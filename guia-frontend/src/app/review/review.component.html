<!-- Listado de reseñas ya hechas -->
<div class="reviews-list">
  <h3>Reseñas</h3>

  <div *ngFor="let r of paginatedReviews" class="review-item">

    <div class="review-header">
      <img 
        class="user-img"
        [src]="'http://localhost:8000/' + r.user_photo"
        *ngIf="r.user_photo"
        alt="user"
      />

      <div>
        <p class="user-name">{{ r.user_name }}</p>
        <p class="user-type">{{ r.user_type }}</p>
      </div>
    </div>

    <div class="rating">
  {{ '⭐'.repeat(r.rating) + '☆'.repeat(5 - r.rating) }}
</div>

    <p class="comment">
      {{ r.comentario }}
    </p>
  </div>

  <!-- PAGINACIÓN -->
  <div class="pagination">
    <button (click)="prevPage()" [disabled]="currentPage === 1">
      ◀ Anterior
    </button>

    <span>Página {{ currentPage }}</span>

    <button 
      (click)="nextPage()" 
      [disabled]="currentPage * reviewsPerPage >= parentReviews.length">
      Siguiente ▶
    </button>
  </div>
</div>


<!-- Formulario de reseñas -->
<div class="review-form">
  <h3>Dejar una reseña</h3>

  <form [formGroup]="reviewForm" (ngSubmit)="submitReview()">

    <label>Calificación:</label>
    <select formControlName="rating">
  <option *ngFor="let n of [1,2,3,4,5]" [value]="n">
    {{ '⭐'.repeat(n) }}
  </option>
</select>

    <label>Comentario:</label>
    <textarea formControlName="comment"></textarea>

    <button type="submit" [disabled]="reviewForm.invalid">Enviar</button>
  </form>
</div>

<hr>

<!-- TOAST -->
<div class="toast" *ngIf="toastMessage" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #333;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  z-index: 9999;
">
  {{ toastMessage }}
</div>
